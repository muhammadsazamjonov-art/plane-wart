# Render Blueprint — Sky Ace 3D
# Faqat 1 ta web xizmat yaratadi (baza shart emas).
# Baza bo'lmasa rekordlar va multiplayer xonalari server xotirasida saqlanadi.
# Doimiy baza kerak bo'lsa: Neon.tech dan bepul Postgres oling va
# Render → Environment → DATABASE_URL ga qo'ying (ixtiyoriy).
services:
  - type: web
    name: sky-ace-3d
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
